<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>ぽちょ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><main id="shell">
  <section id="screen-menu" class="screen active soft-bg">
    <div class="menu-wrap">
      <div class="title-mark">ぽちょ</div>
      <div class="subtitle">なんとなく弾いて、なんとなく点が入る。</div>
      <div class="menu-buttons">
        <button class="big" data-action="open-mode">スタート</button>
        <button class="big" data-action="open-book">図鑑</button>
        <button class="big" data-action="open-stats">実績</button>
      </div>
      <div class="version">prototype v0.2.5 3SET</div>
    </div>
  </section>

  <section id="screen-mode" class="screen soft-bg">
    <button class="back" data-action="menu">‹</button>
    <div class="panel-page">
      <h2>モード</h2><p class="lead">打てる回数が違います。</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="short"><b>SHORT</b><span>15 セット / 45ぽちょ</span><small>短く、勢いで。</small></button>
        <button class="mode-card" data-mode="middle"><b>MIDDLE</b><span>30 セット / 90ぽちょ</span><small>標準。</small></button>
        <button class="mode-card" data-mode="long"><b>LONG</b><span>50 セット / 150ぽちょ</span><small>じっくり盤面を育てる。</small></button>
      </div>
    </div>
  </section>

  <section id="screen-book" class="screen soft-bg">
    <button class="back" data-action="menu">‹</button>
    <div class="panel-page book-page"><h2>ぽちょ図鑑</h2><div id="book-summary" class="summary"></div><div id="book-list" class="book-list"></div></div>
  </section>

  <section id="screen-stats" class="screen soft-bg">
    <button class="back" data-action="menu">‹</button>
    <div class="panel-page"><h2>実績</h2><div id="stats-content"></div></div>
  </section>

  <section id="screen-game" class="screen game-screen">
    <div id="game"></div>
    <header class="game-hud">
      <div class="score-block"><small>SCORE</small><strong id="hud-score">0</strong><span id="hud-best">BEST 0</span></div>
      <div class="remaining-block"><small>のこり</small><strong id="hud-remaining">0</strong></div>
      <div class="next-block"><small>NEXT</small><canvas id="next-preview" width="70" height="70"></canvas></div>
      <button id="settings-btn" class="gear" aria-label="設定">⚙</button>
    </header>
    <div id="score-layer"></div>
    <div id="game-status">射出ゾーンで3ぽちょを振り回してください</div>
  </section>

  <section id="screen-result" class="screen soft-bg">
    <div class="result-wrap"><div class="result-label">RESULT</div><div id="result-score" class="result-score">0</div><div id="result-record" class="record"></div><div id="result-details" class="result-details"></div><div class="result-buttons"><button class="big" data-action="replay">もう一度</button><button class="big secondary" data-action="menu">メニューへ</button></div></div>
  </section>

  <div id="settings-modal" class="modal hidden"><div class="modal-card"><h3>設定</h3><button data-setting="continue">続行</button><button data-setting="retry">リトライ</button><button data-setting="retire" class="danger">リタイア</button></div></div>
  <div id="confirm-modal" class="modal hidden"><div class="modal-card confirm-card"><p id="confirm-text"></p><div class="confirm-actions"><button id="confirm-no">やめる</button><button id="confirm-yes" class="danger">実行する</button></div></div></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script src="data_v025.js"></script>
<script src="game_v025.js"></script>
</body></html>
